<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WPMCP Console</title>
    <style>
      __WPMCP_STYLES__
    </style>
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true"><span>W</span></div>
        <div class="hero-copy">
          <div class="eyebrow">
            <span class="live-dot"></span>WORDPRESS INTELLIGENCE
          </div>
          <h1 id="view-title">WordPress command center</h1>
          <p id="view-subtitle">Your sites, clearly understood and fully controllable.</p>
        </div>
        <div class="site-pill" id="site-pill" aria-label="Active site">site</div>
      </header>

      <nav class="quick-actions" aria-label="WordPress actions">
        <button type="button" data-action="new_post"><span aria-hidden="true">＋</span> New post</button>
        <button type="button" data-action="new_page"><span aria-hidden="true">▤</span> New page</button>
        <button type="button" data-action="activate_plugin"><span aria-hidden="true">▣</span> Plugin</button>
        <button type="button" data-action="activate_theme"><span aria-hidden="true">◆</span> Theme</button>
        <button type="button" data-action="clear_cache" class="secondary-action"><span aria-hidden="true">⟳</span> Clear cache</button>
        <button type="button" data-action="audit" class="secondary-action"><span aria-hidden="true">✓</span> Audit</button>
      </nav>

      <section id="loading-state" class="loading-grid" aria-label="Loading WordPress data">
        <div class="skeleton tall"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </section>
      <section id="content" class="content" hidden></section>
      <section id="error-state" class="error-state" hidden>
        <div class="error-icon">!</div>
        <h2>Unable to display this result</h2>
        <p id="error-message">The tool returned an unsupported response.</p>
      </section>

      <dialog id="action-dialog" aria-labelledby="dialog-title">
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <p class="dialog-eyebrow">WPMCP ACTION</p>
              <h2 id="dialog-title">Action</h2>
            </div>
            <button type="button" class="icon-button" data-close-dialog aria-label="Close dialog">×</button>
          </header>
          <div id="dialog-content"></div>
        </div>
      </dialog>

      <footer>
        <span>WPMCP · Remote WordPress MCP</span>
        <span class="footer-separator">•</span>
        <span id="footer-site">multisite</span>
      </footer>
    </main>
    <script type="module">
      __WPMCP_SCRIPT__;
    </script>
  </body>
</html>
